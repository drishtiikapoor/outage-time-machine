name: outage
topology:
  nodes:
    edge:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - edge/daemons:/etc/frr/daemons
        - edge/frr.conf:/etc/frr/frr.conf
    inet:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - inet/daemons:/etc/frr/daemons
        - inet/frr.conf:/etc/frr/frr.conf
    client:
      kind: linux
      image: wbitt/network-multitool
      exec:
        - ip addr add 203.0.113.10/24 dev eth1
        - ip route add 198.51.100.0/24 via 203.0.113.1
    web:
      kind: linux
      image: nginx:alpine
      exec:
        - ip addr add 198.51.100.10/24 dev eth1
        - ip route add 203.0.113.0/24 via 198.51.100.1
  links:
    - endpoints: ["client:eth1", "inet:eth1"]
    - endpoints: ["inet:eth2", "edge:eth1"]
    - endpoints: ["edge:eth2", "web:eth1"]
